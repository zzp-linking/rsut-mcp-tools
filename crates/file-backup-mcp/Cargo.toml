[package]
name = "file-backup-mcp"
version.workspace = true
edition.workspace = true

[[bin]]
name = "file-backup-tool"
path = "src/main.rs"

[dependencies]
colored = "3"
console = "0.16"
indicatif = "0.18"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[build-dependencies]
winres = "0.1"
